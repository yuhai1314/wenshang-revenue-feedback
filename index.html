.toolbar { position: sticky; top: 0; z-index: 100; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.12); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.toolbar button { cursor: pointer; background: #4472C4; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-size: 12px; }

.toolbar button.green { background: #52c41a; }

.toolbar .sep { width: 1px; height: 24px; background: #ddd; }
.search-box { flex: 1; min-width: 180px; max-width: 300px; }

.stats-bar { background: #e8edf3; padding: 6px 16px; display: flex; gap: 24px; font-size: 12px; color: #555; border-bottom: 1px solid #d0d0d0; }
.stats-bar span { font-weight: bold; color: #1F4E79; }

/* === 性能关键：table-container === */
.table-container { overflow: auto; max-height: calc(100vh - 100px); cursor: grab; }
.table-container.dragging { cursor: grabbing; }

/* === 性能关键：table === */
table { border-collapse: collapse; width: 100%; font-size: 11px; table-layout: fixed; }
th { background: #4472C4; color: #fff; font-weight: bold; text-align: center; padding: 6px 4px; position: sticky; top: 0; z-index: 10; border: 1px solid #3a5fa0; white-space: nowrap; }
th.forecast-header { background: #BF8F00; }

td.biz { background: #E2EFDA; text-align: center; font-weight: bold; }
td.inc { background: #FCE4D6; font-weight: bold; color: #C00000; }
td.highlight { background: #FFFF00; cursor: pointer; }
td.highlight.feedback-done { background: #90EE90; }
td.highlight.feedback-done::after { content: " \2713"; color: #006400; font-weight: bold; }
td.zero { color: #ccc; }
td.cust-name { overflow: hidden; text-overflow: ellipsis; }
td.forecast { background: #FFF2CC; cursor: pointer; }
td.forecast.has-value { font-weight: bold; color: #7F6000; }

const CLOUD_RAW_URL2 = "https://raw.githubusercontent.com/" + GITHUB_CONFIG.owner + "/" + GITHUB_CONFIG.repo + "/" + GITHUB_CONFIG.branch + "/" + GITHUB_CONFIG.path;

function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
}
function base64ToUtf8(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
}

// === 云端拉取：基于时间戳合并，远程较新则覆盖本地 ===
// 双源拉取：先试jsdelivr（缓存短），再试raw.githubusercontent（兜底）
async function fetchCloudJSON() {
    // 策略1：GitHub API（最实时，能拿到最新SHA和content）
    try {
        const apiResp = await fetch(GITHUB_API_URL + "?t=" + Date.now(), {
            headers: { Authorization: "token " + GITHUB_CONFIG.token, Accept: "application/vnd.github.v3+json" }
        });
        if (apiResp.ok) {
            const apiData = await apiResp.json();
            cloudSHA = apiData.sha;
            const content = JSON.parse(base64ToUtf8(apiData.content));
            return content;
        }
    } catch(e) {}
    // 策略2：jsdelivr CDN（缓存短，几分钟内更新）
    try {
        const resp = await fetch(CLOUD_RAW_URL + "?t=" + Date.now());
        if (resp.ok) return await resp.json();
    } catch(e) {}
    // 策略3：raw.githubusercontent（兜底）
    const resp2 = await fetch(CLOUD_RAW_URL2 + "?t=" + Date.now());
    if (!resp2.ok) throw new Error("HTTP " + resp2.status);
    return await resp2.json();
}

async function pullCloudData() {
    if (isSyncing) return;
    isSyncing = true;
    lastPullTime = Date.now();
    try {
        const cloudData = await fetchCloudJSON();
        let updatedCount = 0;
        const cFb = cloudData.feedback || {};
        const cFc = cloudData.forecast || {};
        const cFbTS = cloudData.fbTS || {};
        const cFcTS = cloudData.fcTS || {};

        // 合并feedback：远程时间戳较新则覆盖
        for (const k in cFb) {
            const remoteTS = cFbTS[k] || 0;
            const localTS = feedbackTS[k] || 0;
            if (remoteTS > localTS) {
                feedbackStore[k] = cFb[k];
                feedbackTS[k] = remoteTS;
                updatedCount++;
            }
        }
        // 合并forecast
        for (const k in cFc) {
            const remoteTS = cFcTS[k] || 0;
            const localTS = forecastTS[k] || 0;
            if (remoteTS > localTS) {
                forecastStore[k] = cFc[k];
                forecastTS[k] = remoteTS;
                updatedCount++;
            }
        }
        saveStores();
        if (updatedCount > 0) { renderTable(); updateStats(); }
        lastSyncTime = new Date();
        updateSyncStatus("online", "已同步" + (updatedCount > 0 ? "(更新" + updatedCount + "条)" : ""));
        if (updatedCount > 0) showNewDataBanner(updatedCount);
    } catch(err) {
        updateSyncStatus("offline", "云端同步失败");
    } finally {
        isSyncing = false;
    }
}

// === 推送：带时间戳全量合并 ===
async function pushCloudData() {
    if (!GITHUB_CONFIG.token) return;
    isSyncing = true;
    updateSyncStatus("syncing", "上传中...");
    try {
        let mergedFeedback = {};
        let mergedForecast = {};
        let mergedFbTS = {};
        let mergedFcTS = {};
        const apiResp = await fetch(GITHUB_API_URL, {
            headers: { Authorization: "token " + GITHUB_CONFIG.token, Accept: "application/vnd.github.v3+json" }
        });
        if (apiResp.ok) {
            const apiData = await apiResp.json();
            cloudSHA = apiData.sha;
            const cloudContent = JSON.parse(base64ToUtf8(apiData.content));
            if (cloudContent.feedback) Object.assign(mergedFeedback, cloudContent.feedback);
            if (cloudContent.forecast) Object.assign(mergedForecast, cloudContent.forecast);
            if (cloudContent.fbTS) Object.assign(mergedFbTS, cloudContent.fbTS);
            if (cloudContent.fcTS) Object.assign(mergedFcTS, cloudContent.fcTS);
        }
        // 本地数据按时间戳合并：较新覆盖较旧
        const now = Date.now();
        for (const k in feedbackStore) {
            const localTS = feedbackTS[k] || now;
            const remoteTS = mergedFbTS[k] || 0;
            if (localTS >= remoteTS) {
                mergedFeedback[k] = feedbackStore[k];
                mergedFbTS[k] = localTS;
            }
        }
        for (const k in forecastStore) {
            const localTS = forecastTS[k] || now;
            const remoteTS = mergedFcTS[k] || 0;
            if (localTS >= remoteTS) {
                mergedForecast[k] = forecastStore[k];
                mergedFcTS[k] = localTS;
            }
        }
        const pushData = {
            feedback: mergedFeedback,
            forecast: mergedForecast,
            fbTS: mergedFbTS,
            fcTS: mergedFcTS,
            lastUpdated: new Date().toISOString()
        };
        const content = utf8ToBase64(JSON.stringify(pushData));
        const putResp = await fetch(GITHUB_API_URL, {
            method: "PUT",
            headers: { Authorization: "token " + GITHUB_CONFIG.token, Accept: "application/vnd.github.v3+json", "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Update " + new Date().toISOString().slice(0,19), content: content, sha: cloudSHA })
        });
        if (putResp.ok) {
            const putData = await putResp.json();
            cloudSHA = putData.content.sha;
            lastSyncTime = new Date();
            updateSyncStatus("online", "已同步");
        } else {
            const errData = await putResp.json().catch(function() { return {}; });
            throw new Error(errData.message || ("HTTP " + putResp.status));
        }
    } catch(err) {
        updateSyncStatus("error", "上传失败(本地已保存)");
    } finally {
        isSyncing = false;
    }
}

function schedulePush() {

let isDragging = false;
let dragStartX = 0;
let dragStartScroll = 0;
let rafDragId = null;
let dragContainer = null;

function initDragScroll() {
  dragContainer = document.querySelector('.table-container');
  dragContainer.addEventListener('mousedown', function(e) {
    const target = e.target;
    if (target.closest('td.highlight') || target.closest('td.forecast') || target.closest('input') || target.closest('button') || target.closest('select') || target.closest('textarea')) return;
    isDragging = true;
    dragStartX = e.pageX;
    dragStartScroll = dragContainer.scrollLeft;
    dragContainer.classList.add('dragging');
    e.preventDefault();
  });
  // 用passive listener减少开销
  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    if (rafDragId) return;
    const dx = e.pageX - dragStartX;
    rafDragId = requestAnimationFrame(function() {
      rafDragId = null;
      if (isDragging && dragContainer) dragContainer.scrollLeft = dragStartScroll - dx;
    });
  });
  document.addEventListener('mouseup', function() {
    if (isDragging) {
      isDragging = false;
      if (dragContainer) dragContainer.classList.remove('dragging');
      if (rafDragId) { cancelAnimationFrame(rafDragId); rafDragId = null; }
    }
  });
}

function initKeyboardShortcuts() {
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      var overlay = document.getElementById('modalOverlay');
      if (overlay.classList.contains('show')) { closeModal(); return; }
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      var overlay = document.getElementById('modalOverlay');
      if (overlay.classList.contains('show')) { e.preventDefault(); saveFeedback(); return; }
    }
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault();
      document.getElementById('searchBox').focus();
    }
  });
}

    }
  }
}

    var m = DATA.customers[i].manager;
    if (!seen[m]) { seen[m] = 1; managers.push(m); }
  }
  managers.sort();
  for (var i = 0; i < managers.length; i++) {
    var opt = document.createElement("option");
    opt.value = managers[i];
    opt.textContent = managers[i];
    sel.appendChild(opt);
  }
}

function renderTable() {

    var cust = DATA.customers[ci];
    if (mgrFilter && cust.manager !== mgrFilter) continue;

    var hasContent = false;
    var custParts = [];
    var custIdEsc = esc(cust.id);
    var custNameEsc = esc(cust.name);
    var mgrEsc = esc(cust.manager);
    var pkg5Esc = esc(cust.pkg5);

    for (var bi = 0; bi < cust.businesses.length; bi++) {
      var biz = cust.businesses[bi];
      var hasJumps = biz.jumps.length > 0;
      var hasUnfeedback = false;
      var hasForecastToFill = false;

      for (var ji = 0; ji < biz.jumps.length; ji++) {
        var jkey = cust.id + "_" + biz.name + "_" + biz.jumps[ji].month;
        if (!feedbackStore[jkey]) { hasUnfeedback = true; break; }
      }
      if (viewMode === "forecast") {
        for (var fi = 0; fi < fmonths.length; fi++) {
          var fk = cust.id + "_" + biz.name + "_" + fmonths[fi];
          if (!feedbackStore[fk + "_forecast"]) { hasForecastToFill = true; break; }
        }
      }

      var showBiz = true;
      if (viewMode === "jumps" && !hasJumps) showBiz = false;
      if (viewMode === "unfeedback" && !hasUnfeedback) showBiz = false;
      if (viewMode === "forecast" && !hasForecastToFill) showBiz = false;
      if (!showBiz) continue;

      hasContent = true;
      var rowParts = ['<tr>'];
      rowParts.push('<td class="info">' + custIdEsc + '</td>');
      rowParts.push('<td class="info cust-name">' + custNameEsc + '</td>');
      rowParts.push('<td class="info">' + mgrEsc + '</td>');
      rowParts.push('<td class="info">' + pkg5Esc + '</td>');
      rowParts.push('<td class="biz">' + esc(biz.name) + '</td>');

      var incColor = biz.increment > 0 ? '#C00000' : (biz.increment < 0 ? '#006400' : '#999');
      rowParts.push('<td class="inc" style="color:' + incColor + '">' + fmt(biz.increment) + '</td>');

      // 历史月份
      for (var mi = 0; mi < biz.monthly.length; mi++) {
        var val = biz.monthly[mi];
        var month = months[mi];
        var key = cust.id + "_" + biz.name + "_" + month;
        var hasFeedback = !!feedbackStore[key];
        var jj = jumpLookup[key];

        var cls = jj ? (hasFeedback ? "highlight feedback-done" : "highlight") : "";
        var displayVal = val === 0 ? '<span class="zero">-</span>' : fmt(val);
        var dataAttrs = '';
        if (jj) {
          dataAttrs = ' data-type="jump" data-cid="' + custIdEsc + '" data-cname="' + custNameEsc + '" data-mgr="' + mgrEsc + '" data-pkg5="' + pkg5Esc + '" data-biz="' + esc(biz.name) + '" data-month="' + month + '"';
        }
        rowParts.push('<td class="' + cls + '"' + dataAttrs + '>' + displayVal + '</td>');
      }

      // 预测月份
      for (var fi = 0; fi < fmonths.length; fi++) {
        var fm = fmonths[fi];
        var fk = cust.id + "_" + biz.name + "_" + fm;
        var fval = forecastStore[fk];
        if (fval == null && DATA.forecastData && DATA.forecastData[fk] != null) fval = DATA.forecastData[fk];
        if (fval == null) fval = biz.monthly[biz.monthly.length - 1];
        var hasFb = !!feedbackStore[fk + "_forecast"];

        if (biz.name === "总收入") {
          var sumVal = 0;
          for (var b2i = 0; b2i < cust.businesses.length; b2i++) {
            var b2 = cust.businesses[b2i];
            if (b2.name === "总收入") continue;
            var fk2 = cust.id + "_" + b2.name + "_" + fm;
            var v2 = forecastStore[fk2];
            if (v2 == null && DATA.forecastData && DATA.forecastData[fk2] != null) v2 = DATA.forecastData[fk2];
            if (v2 == null) v2 = b2.monthly[b2.monthly.length - 1];
            sumVal += Number(v2) || 0;
          }
          var cls2 = "forecast has-value";
          if (hasFb) cls2 += " has-feedback";
          rowParts.push('<td class="' + cls2 + '" style="color:#999;cursor:default;">' + fmt(sumVal) + ' <span style="font-size:9px;color:#bbb;">[汇总]</span></td>');
        } else {
          var cls3 = "forecast has-value";
          if (hasFb) cls3 += " has-feedback";
          rowParts.push('<td class="' + cls3 + '" data-type="forecast" data-cid="' + custIdEsc + '" data-cname="' + custNameEsc + '" data-mgr="' + mgrEsc + '" data-pkg5="' + pkg5Esc + '" data-biz="' + esc(biz.name) + '" data-month="' + fm + '">' + fmt(Number(fval)) + '</td>');
        }
      }

      rowParts.push('</tr>');
      custParts.push(rowParts.join(''));
      rowCount++;
    }

    if (hasContent) {
      var colspan = 6 + months.length + fmonths.length;
      parts.push('<tr class="cust-divider"><td colspan="' + colspan + '">' + custNameEsc + ' (' + mgrEsc + ')</td></tr>');
      parts.push(custParts.join(''));
    }
  }

  if (rowCount === 0) {
    var colsp = 6 + months.length + fmonths.length;
    body.innerHTML = '<tr><td colspan="' + colsp + '" class="empty-state">没有符合条件的数据</td></tr>';
  } else {
    body.innerHTML = parts.join('');
  }
}

  if (currentMode === "forecast") {
    var fval = document.getElementById("forecastValue").value.trim();
    if (fval) { forecastStore[currentForecastKey] = Number(fval); forecastTS[currentForecastKey] = now; }

    var text = document.getElementById("feedbackText").value.trim();

    else { delete feedbackStore[currentModalKey]; delete feedbackTS[currentModalKey]; }

      currentCellRef.classList.toggle("has-value", !!fval);

      if (fval) currentCellRef.innerHTML = fmt(Number(fval));

// === 语音输入 ===
function toggleVoice() {
  if (isRecording) { stopVoice(); return; }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { fallbackVoiceInput(); return; }
  try {
    recognition = new SR();
    recognition.lang = "zh-CN";
    recognition.continuous = true;
    recognition.interimResults = true;
    var ta = document.getElementById("feedbackText");
    var finalText = ta.value;
    var restartable = true;
    recognition.onresult = function(event) {
      var interim = "";
      for (var i = event.resultIndex; i < event.results.length; i++) {
        var transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += transcript;
        else interim += transcript;
      }
      ta.value = finalText + interim;
    };
    recognition.onerror = function(event) {
      if (event.error === "network" || event.error === "service-not-allowed") { stopVoice(); fallbackVoiceInput(); }
      else if (event.error !== "no-speech") { showToast("语音识别提示: " + event.error); stopVoice(); }
    };
    recognition.onend = function() {
      if (isRecording && restartable) { try { recognition.start(); } catch(e) { stopVoice(); } }
      else stopVoice();
    };
    recognition.start();
    isRecording = true;
    restartable = true;
    var btn = document.getElementById("voiceBtn");
    btn.classList.add("recording");
    btn.textContent = "停止录音";
    showToast("开始语音输入...");
  } catch(e) { fallbackVoiceInput(); }
}

function fallbackVoiceInput() {
  var ta = document.getElementById("feedbackText");
  ta.focus();
  var hint = document.getElementById("voiceHint");
  hint.innerHTML = "<b>在线语音识别不可用，请使用以下方式：</b><br><b>方式1：</b>按 <b>Win+H</b> 启动Windows语音输入<br><b>方式2：</b>手机微信语音转文字后粘贴<br><b>方式3：</b>直接打字输入";
  hint.classList.add("show");
  var btn = document.getElementById("voiceBtn");
  btn.classList.remove("recording");
  btn.classList.add("voice-fallback");
  btn.textContent = "语音输入(系统)";
  btn.onclick = function() { ta.focus(); showToast("请按 Win+H 键启动Windows语音输入"); };
  showToast("已切换为系统语音输入模式");
}

function showVoiceHint(text, isError) {
  var hint = document.getElementById("voiceHint");
  hint.textContent = text;
  hint.classList.add("show");
}

function stopVoice() {
  if (recognition && isRecording) { try { recognition.stop(); } catch(e) {} }
  isRecording = false;
  var btn = document.getElementById("voiceBtn");
  btn.classList.remove("recording");
  btn.textContent = "语音输入";
}

  a.download = "收入跳变反馈_" + new Date().toISOString().slice(0,10) + ".json";

}

function importFeedback(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var imported = JSON.parse(e.target.result);
      var count = 0;
      var impFb = imported.feedback || imported;
      var impFc = imported.forecast || {};
      var impFbTS = imported.fbTS || {};
      var impFcTS = imported.fcTS || {};
      var now = Date.now();
      for (var k in impFb) {
        var ts = impFbTS[k] || now;
        if (!feedbackTS[k] || ts > feedbackTS[k]) {
          feedbackStore[k] = impFb[k]; feedbackTS[k] = ts; count++;
        }
      }
      for (var k in impFc) {
        var ts = impFcTS[k] || now;
        if (!forecastTS[k] || ts > forecastTS[k]) { forecastStore[k] = impFc[k]; forecastTS[k] = ts; }
      }
      saveStores();
      renderTable();
      updateStats();
      schedulePush();
      showToast("导入完成，新增/更新 " + count + " 条反馈");
    } catch(err) { showToast("导入失败: " + err.message); }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function exportExcelComments() {
  var data = JSON.stringify({feedback: feedbackStore, forecast: forecastStore}, null, 2);
  var blob = new Blob([data], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "feedback_store.json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("已导出，请发送给助手更新Excel");
}

function esc(s) {
  if (s == null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function fmt(n) {
  if (n == null || n === 0) return "-";
  return Number(n).toLocaleString("zh-CN");
}

function showNewDataBanner(count) {
  var banner = document.getElementById('newDataBanner');
  if (!banner) return;
  banner.textContent = '从云端同步了 ' + count + ' 条更新';
  banner.classList.add('show');
  setTimeout(function() { banner.classList.remove('show'); }, 4000);
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 2500);
}

init();
</script>
